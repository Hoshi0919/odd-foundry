[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "odd-foundry"
version = "1.0.0"
description = "Active Odd Elasticity, Non-Reciprocal Metamaterials & Anti-Jamming Logistics Simulator"
authors = [{ name = "Hoshi", email = "hoshi0919@outlook.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v"
